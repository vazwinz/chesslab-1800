# Builds the AURA desktop app for Windows and Linux.
# Run it from the Actions tab (workflow_dispatch) or by pushing a tag like v0.4.0.
# On a tag push it also publishes a GitHub Release with the installer: that release is what the
# app's "Nova versão disponível" notice reads (it looks for the AURA-Setup-*.exe asset).
name: desktop
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Tests
        shell: bash
        run: |
          python -m pip install -r backend/requirements-dev.txt
          cd backend && python -m pytest -q   # Stockfish-dependent tests skip when no engine is installed
      - name: Frontend typecheck
        shell: bash
        run: cd frontend && npm ci && npx tsc -b
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/build_windows.ps1 -NoShortcuts
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: NO_INSTALL=1 bash desktop/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AURA-${{ runner.os }}
          path: |
            desktop/dist/AURA-*.zip
            desktop/dist/AURA-*.tar.gz
            desktop/dist/AURA-Setup-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" \
            --title "AURA ${GITHUB_REF_NAME#v}" \
            --notes "Baixe o AURA-Setup-${GITHUB_REF_NAME#v}.exe e instale por cima da versão anterior: o seu progresso é mantido."
