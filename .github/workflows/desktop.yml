# Builds the AURA desktop app for Windows and Linux.
# Run it from the Actions tab (workflow_dispatch) or by pushing a tag like v0.3.0.
# Download the zips from the run's "Artifacts" section.
name: desktop
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Tests
        shell: bash
        run: |
          python -m pip install -r backend/requirements-dev.txt
          cd backend && python -m pytest -q   # Stockfish-dependent tests skip when no engine is installed
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/build_windows.ps1 -NoShortcuts
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: NO_INSTALL=1 bash desktop/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AURA-${{ runner.os }}
          path: desktop/dist/AURA-*.*
