<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AURA</title>
    <meta name="description" content="Treino de xadrez com o Stockfish para chegar aos 1800." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232944b8'/><path d='M9 25h14v-2.5H9zM11 21h10l-1.2-6.5c2-1 3.2-3 3.2-5.2C23 6.4 20 4.5 16.6 5c-3 .4-5.6 3.3-5.6 6.4 0 1.3.3 2.4.9 3.3L13 21z' fill='white'/></svg>" />
    <script>
      // theme before first paint (the server also injects data-theme from the saved preference)
      try {
        var t = localStorage.getItem("aura.theme");
        if ((t === "light" || t === "dark") && !document.documentElement.dataset.theme) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
