# Developer convenience only: the app runs migrations by itself at startup (app/migrate.py).
#   cd backend && .venv/bin/python -m alembic -c alembic.ini revision --autogenerate -m "what changed"
[alembic]
script_location = app/migrations
prepend_sys_path = .
# sqlalchemy.url is taken from DATABASE_URL / CHESSLAB_DATA_DIR (app/config.py) when left empty
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
